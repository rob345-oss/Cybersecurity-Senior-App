name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set — skipping Render API deploy."
            echo "Frontend still deploys via the Deploy GitHub Pages workflow."
            echo "Add the secret from Render → Service → Settings → Deploy Hook when ready."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered."

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: frontend
        run: |
          missing=0
          if [ -z "$VERCEL_TOKEN" ]; then echo "::warning::Missing secret VERCEL_TOKEN"; missing=1; fi
          if [ -z "$VERCEL_ORG_ID" ]; then echo "::warning::Missing secret VERCEL_ORG_ID"; missing=1; fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then echo "::warning::Missing secret VERCEL_PROJECT_ID"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Skipping Vercel CLI deploy. Frontend still deploys via Deploy GitHub Pages."
            echo "Add VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID under Actions secrets for vercel.app hosting,"
            echo "or connect the repo in Vercel / use Cursor Agents → Publish."
            exit 0
          fi
          npx vercel@latest deploy --prod --token "$VERCEL_TOKEN" --yes
