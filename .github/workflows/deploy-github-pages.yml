name: Deploy GitHub Pages

# Publishes the Next.js marketing site + Live Demo.
# Primary path: push static files to the `gh-pages` branch (no Vercel secrets).
# Optional: also deploys via GitHub Actions Pages when that source is enabled.
#
# Live URL after Pages is enabled for the gh-pages branch:
#   https://rob345-oss.github.io/Cybersecurity-Senior-App/
#
# One-time setup (repo owner):
#   Settings → Pages → Build and deployment → Source: Deploy from a branch
#   Branch: gh-pages / (root) → Save
#   OR Source: GitHub Actions (also supported by this workflow)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and export
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f out/index.html
          test -d out/demo
          grep -R -l "Try Live Demo" out >/dev/null
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE_PATH: /Cybersecurity-Senior-App
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - name: Upload build for branch publish
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: frontend/out
          retention-days: 3

  publish-gh-pages-branch:
    name: Publish gh-pages branch
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy marketing site + Live Demo'

  deploy-actions-pages:
    name: Deploy via GitHub Actions Pages
    needs: build
    runs-on: ubuntu-latest
    # Continues even when Pages source is not yet set to "GitHub Actions"
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
